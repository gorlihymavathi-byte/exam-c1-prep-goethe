<!doctype html>
<html lang="de" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goethe C1 Wortschatz Studio</title>
    <meta name="description" content="Desktop-style German vocabulary mastery app for Goethe C1 featuring Active Recall, contextual example sentences, polysemous word training, and an adaptive mistake repetition queue." />
    <meta property="og:title" content="Goethe C1 Wortschatz Studio" />
    <meta property="og:description" content="Desktop-style German vocabulary mastery app for Goethe C1 featuring Active Recall, contextual example sentences, polysemous word training, and an adaptive mistake repetition queue." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- PWA & Desktop/Mobile App Metadata -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goethe C1" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
  </head>
  <body class="h-full overflow-hidden bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <div id="root" class="h-full"></div>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
