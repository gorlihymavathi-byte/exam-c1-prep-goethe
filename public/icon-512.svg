<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Brain & Neural Synapse Motif -->
  <g transform="translate(106, 96)">
    <!-- Central Brain Silhouette -->
    <path d="M150 40 C100 40, 60 75, 60 120 C40 125, 20 145, 20 175 C20 205, 45 225, 65 230 C65 265, 95 290, 135 290 C145 290, 150 288, 150 288 C150 288, 155 290, 165 290 C205 290, 235 265, 235 230 C255 225, 280 205, 280 175 C280 145, 260 125, 240 120 C240 75, 200 40, 150 40 Z" fill="url(#accentGrad)" opacity="0.9" />
    
    <!-- Neural Node Points -->
    <circle cx="150" cy="90" r="10" fill="#ffffff" />
    <circle cx="95" cy="140" r="8" fill="#ffffff" />
    <circle cx="205" cy="140" r="8" fill="#ffffff" />
    <circle cx="120" cy="200" r="8" fill="#60a5fa" />
    <circle cx="180" cy="200" r="8" fill="#60a5fa" />
    <circle cx="150" cy="250" r="9" fill="#38bdf8" />

    <!-- Connecting Synaptic Lines -->
    <line x1="150" y1="90" x2="95" y2="140" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="150" y1="90" x2="205" y2="140" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="95" y1="140" x2="120" y2="200" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="205" y1="140" x2="180" y2="200" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="120" y1="200" x2="150" y2="250" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="180" y1="200" x2="150" y2="250" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="120" y1="200" x2="180" y2="200" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- C1 Badge at Bottom -->
  <rect x="186" y="380" width="140" height="48" rx="24" fill="url(#goldGrad)" />
  <text x="256" y="413" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="2">C1</text>
</svg>
